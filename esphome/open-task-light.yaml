substitutions:
  name: open-task-light
  friendly_name: Open Task Light

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}  # reuses the API key, so only someone holding it can flash

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

i2c:
  sda: GPIO22  # D4
  scl: GPIO23  # D5
  frequency: 400kHz

switch:
  # XIAO ESP32-C6 RF switch: ESP-IDF doesn't set these up the way the Arduino core does.
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3  # low = RF switch powered
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: rf_antenna_select
    pin: GPIO14  # low = onboard ceramic antenna, high = U.FL
    restore_mode: ALWAYS_OFF
    internal: true

output:
  - platform: mcp4725
    id: led_dac
    address: 0x60
    # AL8860 CTRL is linear from 0.3V (0%) to 2.5V (100%). The 3.3k/4.3k divider maps DAC full scale to 2.53V.
    # 0.17 x 2.53V = 0.43V, about 6% of full current (~40mA) at 1% brightness: inside the AL8860's recommended
    # 5-100% analog dimming range, with margin over the MCP4725 offset, 1% resistors and the 3V3 tolerance.
    min_power: 0.17
    zero_means_zero: true

light:
  - platform: monochromatic
    id: lamp
    name: Lamp
    output: led_dac
    gamma_correct: 2.2
    default_transition_length: 400ms
    restore_mode: RESTORE_DEFAULT_OFF
    # Catches every turn-on path (touch, Home Assistant, restore) while the board is over temperature.
    on_turn_on:
      - if:
          condition:
            binary_sensor.is_on: over_temperature
          then:
            - light.turn_off: lamp

sensor:
  - platform: tmp1075
    id: board_temp
    name: Board temperature
    update_interval: 10s
    # Same limits as the original firmware (HIGH_TEMP 50, MAX_TEMP 56).
    # The TMP1075 powers up active-low, so ALERT floats high (via R6) and Q1 holds CTRL at 0V: the LED stays off
    # until this config switches ALERT to active-high. From then on ALERT only releases (and Q1 kills the LED in
    # hardware) above 56C, even if the ESP has crashed.
    alert:
      limit_high: 56
      limit_low: 50
      function: comparator
      polarity: active_high

  - platform: veml7700
    address: 0x10
    update_interval: 10s
    ambient_light:
      name: Ambient light

binary_sensor:
  - platform: gpio
    id: touch_power
    name: Touch power
    pin: GPIO2  # D2, U7
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - if:
            condition:
              light.is_on: lamp
            then:
              - light.turn_off: lamp
            else:
              - light.turn_on: lamp

  - platform: gpio
    id: touch_up
    name: Touch up
    pin: GPIO1  # D1, U9
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - while:
            condition:
              and:
                - binary_sensor.is_on: touch_up
                - light.is_on: lamp
            then:
              - light.dim_relative:
                  id: lamp
                  relative_brightness: 5%
                  transition_length: 100ms
                  brightness_limits:
                    min_brightness: 1%
              - delay: 120ms

  - platform: gpio
    id: touch_down
    name: Touch down
    pin: GPIO21  # D3, U8
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - while:
            condition:
              and:
                - binary_sensor.is_on: touch_down
                - light.is_on: lamp
            then:
              - light.dim_relative:
                  id: lamp
                  relative_brightness: -5%
                  transition_length: 100ms
                  brightness_limits:
                    min_brightness: 1%
              - delay: 120ms

  - platform: gpio
    id: over_temperature
    name: Over temperature
    device_class: heat
    pin: GPIO18  # D10, TMP1075 ALERT (active-high once configured, R6 pull-up)
    filters:
      # ALERT reads high for a moment at power-up, before the TMP1075 is configured.
      - delayed_on: 2s
    on_press:
      then:
        - light.turn_off: lamp
